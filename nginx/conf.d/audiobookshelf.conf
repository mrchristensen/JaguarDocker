server {
    listen 80;
    server_name audiobookshelf.jaguar.rushrage.com;

    # Allow Let's Encrypt certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name audiobookshelf.jaguar.rushrage.com;

    # Let's Encrypt certificate
    ssl_certificate /etc/letsencrypt/live/audiobookshelf.jaguar.rushrage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audiobookshelf.jaguar.rushrage.com/privkey.pem;

    location / {
        # Nginx -> Audiobookshelf uses HTTP
        proxy_pass http://192.168.0.41:13378;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

	# Rewrite any HTTP redirects from ABS to HTTPS
	proxy_redirect http:// https://;
    }
}
