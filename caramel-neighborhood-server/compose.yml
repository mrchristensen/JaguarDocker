services:
  mc:
    container_name: minecraft-server
    image: itzg/minecraft-server:latest
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "31475:25565"
      - "31476:8100"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "26.2"
      #MEMORY: "4096M"  # 4 gb
      MEMORY: "12288M"  # 12gb
      MOTD: "Get your snacks"
      USE_MEOWICE_FLAGS: "true"
      TZ: "America/New_York"
      DIFFICULTY: "3"
      SPAWN_PROTECTION: "0"
      MODRINTH_PROJECTS: |-
        cloth-config?
        fabric-api?
        forge-config-api-port?
        ferrite-core?
        lithium?
        c2me-fabric?
        no-chat-reports?
        armor-poser?
        view-distance-fix?
        bluemap?
        bluemap-offline-player-markers-(fabric)?
        krypton?
        clumps?
        mods-command?
        adventure-platform-mod?
        bmarker?
        silk?
        fabric-language-kotlin?
        peek?
        unplugged-afk?
      MODRINTH_ALLOWED_VERSION_TYPE: "alpha"
      VANILLATWEAKS_SHARECODE: "cVO185"
      OPS: |-
        rush_rage
      ENABLE_WHITELIST: "true"
      WHITELIST: |-
        rush_rage
        snowconec
        candy098
        PolarBaron
        Tailtiu1
        IdylOne
        hodyb10
        Epsilon4345
        luccyxx
        kelflux
        WhereIsM3g
        YouAreADevil
        SparkleOverlord
        StacheNinja
        Unplayable_Games
        rbeeee
        kurappii
        Lostmckey
      SERVER_NAME: "Caramel Neighborhood"
    volumes:
      - "./data:/data"

  mc-backup:
    container_name: minecraft-backup
    image: itzg/mc-backup
    restart: unless-stopped
    depends_on:
      mc:
        condition: service_healthy
    env_file: .env
    environment:
      RCON_HOST: "mc"
      BACKUP_NAME: "caramel-neighborhood-minecraft-server"
      # Suffixes like "m" for minutes, "h" for hours, "d" for days, etc. are supported.
      BACKUP_INTERVAL: "24h"
      # Number of days to keep backups before pruning.
      PRUNE_BACKUPS_DAYS: "7"
      BACKUP_METHOD: "rclone"
      # The remote that was created when you set up the rclone config.
      RCLONE_REMOTE: "gdrive" 
      # The folder in your Google Drive where backups will be stored.
      RCLONE_DEST_DIR: "caramel-neighborhood-minecraft-backup" 
      # Default excludes + exclude your rclone config because it contains sensitive information.
      EXCLUDES: "*.jar,cache,bluemap,logs,*.tmp,**/rclone.conf"
      POST_BACKUP_SCRIPT_FILE: "/discord-backup-notify.sh"
    volumes:
      # Must be the same mount as the "mc" service, but can be read-only.
      - ./data:/data:ro
      # The rclone.conf file will be searched in the /config/rclone directory inside the container, so do not change this path.
      - ./rclone:/config/rclone
      # For the Discord notifications
      - ./discord-backup-notify.sh:/discord-backup-notify.sh:ro
