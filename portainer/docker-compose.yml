services:
  portainer:
    image: portainer/portainer-ce:sts
    container_name: portainer
    restart: always

    environment:
      TZ: America/New_York

    ports:
      - "8000:8000"
      - "9443:9443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
    external: true
