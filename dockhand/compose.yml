services:
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped

    environment:
      - TZ=America/New_York

    ports:
      - "3000:3000"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data

volumes:
  dockhand_data:
